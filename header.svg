<svg width="1000" height="260" viewBox="0 0 1000 260" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0000"/>
      <stop offset="0.5" stop-color="#1F0308"/>
      <stop offset="1" stop-color="#050000"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FF0033" stroke-opacity="0.14" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF0033" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FF0033" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FF0033" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vig" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.85"/>
    </radialGradient>
  </defs>

  <rect width="1000" height="260" fill="url(#bg)"/>

  <!-- moving grid -->
  <g>
    <rect x="0" y="-40" width="1000" height="340" fill="url(#grid)"/>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="0 40" dur="2.5s" repeatCount="indefinite"/>
  </g>

  <!-- scanline sweep -->
  <rect x="0" y="0" width="1000" height="70" fill="url(#scan)">
    <animateTransform attributeName="transform" type="translate" from="0 -70" to="0 260" dur="3.5s" repeatCount="indefinite"/>
  </rect>

  <!-- corner brackets -->
  <g fill="none" stroke="#FF0033" stroke-width="3" filter="url(#glow)">
    <path d="M20 62V20H62"/>
    <path d="M938 20H980V62"/>
    <path d="M20 198V240H62"/>
    <path d="M938 240H980V198"/>
    <animate attributeName="stroke-opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/>
  </g>

  <!-- HUD text -->
  <g font-family="'Courier New', monospace" font-size="11" fill="#FF3B3B" letter-spacing="2">
    <circle cx="78" cy="25" r="4" fill="#FF0033">
      <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <text x="90" y="29">SYS://ONLINE</text>
    <text x="922" y="29" text-anchor="end">RED_PROTOCOL // v2.0</text>
    <text x="78" y="236">LAT 8.3114 N // LON 80.4037 E</text>
    <text x="922" y="236" text-anchor="end">0xVB</text>
  </g>

  <!-- glitch title layers -->
  <g font-family="'Courier New', monospace" font-size="54" font-weight="900" letter-spacing="4" text-anchor="middle">
    <text x="500" y="125" fill="#FF6A00" opacity="0.85">VIBOOTHI BALASOORIYA
      <animateTransform attributeName="transform" type="translate" calcMode="discrete"
        values="0 0;5 1;0 0;-6 -1;0 0;3 0;0 0" keyTimes="0;0.08;0.14;0.5;0.56;0.8;0.86" dur="4s" repeatCount="indefinite"/>
    </text>
    <text x="500" y="125" fill="#FF0033" opacity="0.9">VIBOOTHI BALASOORIYA
      <animateTransform attributeName="transform" type="translate" calcMode="discrete"
        values="0 0;-5 -1;0 0;6 1;0 0;-3 0;0 0" keyTimes="0;0.08;0.14;0.5;0.56;0.8;0.86" dur="4s" repeatCount="indefinite"/>
    </text>
    <text x="500" y="125" fill="#FFE1E1" filter="url(#glow)">VIBOOTHI BALASOORIYA</text>
  </g>

  <!-- subtitle -->
  <text x="500" y="168" text-anchor="middle" font-family="'Courier New', monospace" font-size="18" fill="#FF3B3B" letter-spacing="6">
    [ FULL STACK DEVELOPER // UI/UX ]
    <animate attributeName="opacity" values="1;1;0.3;1;0.7;1;1" keyTimes="0;0.4;0.43;0.46;0.5;0.53;1" dur="3s" repeatCount="indefinite"/>
  </text>

  <!-- prompt line + cursor -->
  <g font-family="'Courier New', monospace" font-size="14" fill="#B32030">
    <text x="330" y="202">&gt; Sri Lanka // Ravenspun // Design + Code</text>
    <rect x="655" y="190" width="9" height="15" fill="#FF0033">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- moving dashed line -->
  <line x1="60" y1="222" x2="940" y2="222" stroke="#FF0033" stroke-width="2" stroke-dasharray="24 12" opacity="0.8">
    <animate attributeName="stroke-dashoffset" from="0" to="-72" dur="1.5s" repeatCount="indefinite"/>
  </line>

  <rect width="1000" height="260" fill="url(#vig)"/>
</svg>
